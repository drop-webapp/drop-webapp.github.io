<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4eff9">
  <link rel="icon" type="image/png" href="./drop-icon.png?v=5ad550d3fba9">
  <title>一滴 Drop</title>
  <link rel="stylesheet" href="./journal.css?v=f1977c52014a">
  <script src="./journal.js?v=16ea88c869f6" defer></script>
</head>
<body data-api-origin="https://api.drop.jyonn.space" data-share-token="">
  <header class="masthead wrap">
    <a class="brand" href="/"><img src="./drop-icon.png?v=5ad550d3fba9" width="32" height="32" alt="">一滴 <span lang="en">Drop</span></a>
    <span id="identity"></span>
    <a id="grants" class="quiet" href="https://api.drop.jyonn.space/oauth/grants/" hidden>应用授权</a>
    <button id="logout" class="quiet" type="button" hidden>退出</button>
  </header>
  <main class="wrap">
    <p id="notice" role="status" hidden></p>
    <section id="guest" class="guest" hidden>
      <h1>把今天<br>留下一滴。</h1>
      <p>随手记下此刻，日后按天回看。</p>
      <a class="primary" href="https://api.drop.jyonn.space/api/integrations/frienden/login/">使用 Frienden 登录</a>
      <button class="quiet" id="dev-login" type="button" hidden>本地开发登录</button>
    </section>
    <section id="journal" hidden>
      <div class="spread">
        <section class="capture" aria-labelledby="capture-title">
          <h2 id="capture-title">写日记</h2>
          <form id="editor">
            <fieldset id="editor-controls" class="editor-controls" aria-label="日记内容">
              <label class="sr-only" for="text">记录正文</label>
              <textarea id="text" name="text" rows="5" placeholder="此刻想记下什么？" required></textarea>
              <div class="capture-tools">
                <button class="quiet" type="button" id="record" aria-pressed="false">语音转文字</button>
                <button class="quiet" type="button" id="locate">记录位置</button>
              </div>
              <button type="button" class="quiet" id="backdate" hidden></button>
              <details id="details">
                <summary>记录详情</summary>
                <div class="fields">
                  <input type="hidden" name="occurred_at"><output id="capture-time"></output>
                  <input type="hidden" name="city">
                  <input type="hidden" name="place">
                  <label hidden>关联日程<select name="event"><option value="">无</option></select></label>
                  <div id="event-options" role="group" aria-label="关联日程"></div>
                  <output id="coordinates"></output>
                  <button type="button" id="clear-location" class="quiet" hidden>移除坐标</button>
                </div>
              </details>
              <div class="capture-actions">
                <button class="primary" type="submit" id="save">记一滴</button>
                <button class="quiet" type="button" id="cancel" hidden>取消编辑</button>
              </div>
            </fieldset>
            <p id="editor-status" role="status"></p>
          </form>
        </section>
        <section class="recall" aria-labelledby="day-title">
          <div class="date-row">
            <h1 id="day-title"></h1>
            <span id="year"></span>
          </div>
          <nav class="date-tools" aria-label="选择回顾日期">
            <button type="button" id="prev" aria-label="前一天">←</button>
            <input type="hidden" id="date"><button type="button" id="open-date" aria-expanded="false" aria-controls="date-panel">选日期</button>
            <button type="button" id="next" aria-label="后一天">→</button>
            <button type="button" id="today" class="quiet">回到今天</button>
            <button type="button" id="write" class="quiet">写一条</button>
          </nav>
          <section id="date-panel" class="date-panel" aria-label="选择日期" hidden>
            <div class="date-tools"><button id="prev-month" aria-label="上个月">‹</button><strong id="month-label" aria-live="polite"></strong><button id="next-month" aria-label="下个月">›</button></div>
            <div class="month-grid" id="month-days"></div>
          </section>
          <form id="search-form" class="date-tools" role="search">
            <label class="sr-only" for="search-text">搜索日记</label>
            <input id="search-text" type="search" maxlength="120" placeholder="搜索正文、地点或日程" required>
            <button type="submit">搜索</button><button type="button" id="clear-search" hidden>返回当天</button>
          </form>
          <p id="search-status" role="status"></p>
          <div id="search-results"></div>
          <div id="daily-view">
          <details id="calendar"><summary>当天日程</summary><div id="events"></div>
            <button type="button" id="archive" hidden>归档所选日程</button>
          </details>
          <p id="entry-state" role="status"></p>
          <button type="button" id="retry-day" class="quiet" hidden>重新载入</button>
          <div class="waterfall" id="entries"></div>
          <details id="share" class="share">
            <summary>分享与链接管理<span id="share-count"></span></summary>
            <p>勾选当天要分享的记录，再选择接收方可见的字段。</p>
            <form id="share-form">
              <fieldset><legend>可见字段</legend>
                <label><input type="checkbox" name="fields" value="text" checked> 正文</label>
                <label><input type="checkbox" name="fields" value="occurred_at"> 时间</label>
                <label><input type="checkbox" name="fields" value="city"> 城市</label>
                <label><input type="checkbox" name="fields" value="place"> 地点</label>
                <label><input type="checkbox" name="fields" value="latitude"> 纬度</label>
                <label><input type="checkbox" name="fields" value="longitude"> 经度</label>
                <label><input type="checkbox" name="fields" value="event"> 日程</label>
              </fieldset>
              <fieldset><legend>有效期</legend><label><input type="radio" name="expires_in" value="3600"> 1 小时</label><label><input type="radio" name="expires_in" value="86400" checked> 1 天</label><label><input type="radio" name="expires_in" value="604800"> 7 天</label></fieldset>
              <button type="submit" id="create-share" disabled>创建链接</button>
            </form>
            <div id="share-result"></div>
            <div id="links"></div>
          </details>
          </div>
        </section>
      </div>
    </section>
    <section id="public" class="public" hidden>
      <h1>分享的记录</h1>
      <p id="public-state" role="status"></p>
      <div class="waterfall" id="public-entries"></div>
    </section>
  </main>
</body>
</html>
